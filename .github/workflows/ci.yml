name: CI - MLflow Training Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'modelling.py'
      - 'MLProject'
      - 'conda.yaml'
      - 'heart_disease_preprocessing/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn pandas numpy matplotlib seaborn joblib
      
      - name: Run MLflow Training
        run: |
          python modelling.py \
            --n_estimators 200 \
            --max_depth 10 \
            --min_samples_split 5 \
            --min_samples_leaf 2
      
      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlruns/
            artifacts/
          retention-days: 30
      
      - name: Package Artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          tar -czf model-artifacts.tar.gz mlruns/ artifacts/ || true
          echo "Artifacts packaged successfully"
